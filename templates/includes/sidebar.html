{% load static %}
{% with current_view=request.resolver_match.view_name %}
<aside
    class="app-sidebar offcanvas-lg offcanvas-start"
    tabindex="-1"
    id="appSidebar"
    aria-labelledby="appSidebarLabel"
>
    <div class="offcanvas-header d-lg-none">
        <div class="offcanvas-title d-flex align-items-center" id="appSidebarLabel">
            <a href="{% url 'budgets:dashboard' %}" class="sidebar-brand-link text-decoration-none d-flex align-items-center" title="Jubao">
                <img src="{% static 'images/logo/jubao_text_light.png' %}" alt="Jubao" width="1192" height="505" class="sidebar-logo-text" loading="eager">
            </a>
        </div>
        <button
            type="button"
            class="btn-close btn-close-white"
            data-bs-dismiss="offcanvas"
            data-bs-target="#appSidebar"
            aria-label="Close navigation menu"
        ></button>
    </div>

    <div class="app-sidebar-brand d-none d-lg-flex align-items-center">
        <a href="{% url 'budgets:dashboard' %}" class="sidebar-brand-link text-decoration-none text-white d-flex align-items-center" title="Jubao">
            <img src="{% static 'images/logo/jubao_text_light.png' %}" alt="Jubao" width="1192" height="505" class="sidebar-logo-text" loading="eager">
            <img src="{% static 'images/logo/jubao_logo_light.png' %}" alt="Jubao" width="374" height="367" class="sidebar-logo-icon" loading="eager">
        </a>
    </div>

    <div class="offcanvas-body d-flex flex-column p-0">
        <nav aria-label="Primary navigation" class="sidebar-nav-scroll flex-grow-1">
            <ul class="nav flex-column list-unstyled mb-0">
                <li class="nav-item">
                    <a
                        href="{% url 'budgets:dashboard' %}"
                        class="nav-link sidebar-nav-link {% if current_view == 'budgets:dashboard' or current_view == 'budgets:reports' %}active{% endif %}"
                        title="Dashboard"
                        {% if current_view == 'budgets:dashboard' or current_view == 'budgets:reports' %}aria-current="page"{% endif %}
                    >
                        <svg class="sidebar-nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                            <rect x="3.5" y="3.5" width="17" height="17" rx="2"/>
                            <line x1="12" y1="3.5" x2="12" y2="20.5"/>
                            <line x1="3.5" y1="12" x2="20.5" y2="12"/>
                        </svg>
                        <span>Dashboard</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a
                        href="{% url 'budgets:transactions' %}"
                        class="nav-link sidebar-nav-link {% if current_view == 'budgets:transactions' %}active{% endif %}"
                        title="Transactions"
                        {% if current_view == 'budgets:transactions' %}aria-current="page"{% endif %}
                    >
                        <svg class="sidebar-nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                            <rect x="4" y="3" width="16" height="18" rx="2"/>
                            <line x1="8.5" y1="3" x2="8.5" y2="21"/>
                            <line x1="11.5" y1="7.5" x2="16.5" y2="7.5"/>
                            <line x1="11.5" y1="12" x2="16.5" y2="12"/>
                            <line x1="11.5" y1="16.5" x2="15" y2="16.5"/>
                        </svg>
                        <span>Transactions</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a
                        href="{% url 'budgets:budgets' %}"
                        class="nav-link sidebar-nav-link {% if current_view == 'budgets:budgets' %}active{% endif %}"
                        title="Budgets"
                        {% if current_view == 'budgets:budgets' %}aria-current="page"{% endif %}
                    >
                        <svg class="sidebar-nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                            <rect x="3" y="6.5" width="18" height="13" rx="2"/>
                            <path d="m3 7.5 6.5 4.5"/>
                            <path d="m14.5 12 6.5-4.5"/>
                            <circle cx="12" cy="12.5" r="2.5"/>
                        </svg>
                        <span>Budgets</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a
                        href="{% url 'budgets:shared_space' %}"
                        class="nav-link sidebar-nav-link {% if current_view == 'budgets:shared_space' or current_view == 'budgets:shared_activity' or current_view == 'budgets:sharing_privacy' %}active{% endif %}"
                        title="Shared Space"
                        {% if current_view == 'budgets:shared_space' or current_view == 'budgets:shared_activity' or current_view == 'budgets:sharing_privacy' %}aria-current="page"{% endif %}
                    >
                        <svg class="sidebar-nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                            <circle cx="8.5" cy="12" r="6"/>
                            <circle cx="15.5" cy="12" r="6"/>
                        </svg>
                        <span>Shared Space</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a
                        href="{% url 'budgets:wallets' %}"
                        class="nav-link sidebar-nav-link {% if current_view == 'budgets:wallets' %}active{% endif %}"
                        title="Wallets"
                        {% if current_view == 'budgets:wallets' %}aria-current="page"{% endif %}
                    >
                        <svg class="sidebar-nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                            <circle cx="10.5" cy="4.5" r="1.3"/>
                            <circle cx="13.5" cy="4.5" r="1.3"/>
                            <path d="M7 7h10"/>
                            <path d="M7 7 C 4 10, 3.5 17, 6.5 19.5 C 9 21.5, 15 21.5, 17.5 19.5 C 20.5 17, 20 10, 17 7"/>
                        </svg>
                        <span>Wallets</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a
                        href="{% url 'budgets:savings_goals' %}"
                        class="nav-link sidebar-nav-link {% if current_view == 'budgets:savings_goals' %}active{% endif %}"
                        title="Savings Goals"
                        {% if current_view == 'budgets:savings_goals' %}aria-current="page"{% endif %}
                    >
                        <svg class="sidebar-nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                            <rect x="7" y="5.5" width="10" height="2.5" rx="1"/>
                            <path d="M8 8 C5.5 10, 5 13.5, 5 18 a 2 2 0 0 0 2 2 h10 a 2 2 0 0 0 2 -2 C 19 13.5, 18.5 10, 16 8"/>
                            <circle cx="12" cy="14" r="2.8"/>
                        </svg>
                        <span>Savings Goals</span>
                    </a>
                </li>
            </ul>
        </nav>

        <div class="sidebar-footer flex-shrink-0 mt-auto">
            <ul class="nav flex-column list-unstyled mb-0">
                <li class="nav-item">
                    <a
                        href="{% url 'accounts:settings' %}"
                        class="nav-link sidebar-nav-link {% if current_view == 'accounts:settings' or current_view == 'budgets:currencies' %}active{% endif %}"
                        title="Settings"
                        {% if current_view == 'accounts:settings' or current_view == 'budgets:currencies' %}aria-current="page"{% endif %}
                    >
                        <svg class="sidebar-nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                            <line x1="4" y1="7" x2="7" y2="7"/>
                            <circle cx="9.5" cy="7" r="2.5"/>
                            <line x1="12" y1="7" x2="20" y2="7"/>
                            <line x1="4" y1="12" x2="13" y2="12"/>
                            <circle cx="15.5" cy="12" r="2.5"/>
                            <line x1="18" y1="12" x2="20" y2="12"/>
                            <line x1="4" y1="17" x2="7" y2="17"/>
                            <circle cx="9.5" cy="17" r="2.5"/>
                            <line x1="12" y1="17" x2="20" y2="17"/>
                        </svg>
                        <span>Settings</span>
                    </a>
                </li>
                {% if request.user.is_authenticated %}
                <li class="nav-item">
                    <form method="post" action="{% url 'accounts:logout' %}" class="w-100 m-0 p-0" id="sidebar-logout-form">
                        {% csrf_token %}
                        <button type="submit" class="nav-link sidebar-nav-link sidebar-logout-btn" title="Log out">
                            <svg class="sidebar-nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                                <path d="M10 4H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h5"/>
                                <line x1="9" y1="12" x2="21" y2="12"/>
                                <polyline points="16 7 21 12 16 17"/>
                            </svg>
                            <span>Log out</span>
                        </button>
                    </form>
                </li>
                {% endif %}
            </ul>
        </div>
    </div>
</aside>
{% endwith %}
