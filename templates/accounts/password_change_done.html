{% extends "base.html" %}

{% block title %}Password Changed | Budget Tracker{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">
        <section class="dashboard-panel p-3 p-md-4 text-center" aria-labelledby="password-changed-heading">
            <h2 id="password-changed-heading" class="h5 fw-semibold mb-2">Password updated</h2>
            <p class="text-secondary small mb-3">
                Your password has been changed and your current session remains signed in.
            </p>
            <a href="{% url 'accounts:settings' %}" class="btn btn-primary btn-sm">
                Return to Settings
            </a>
        </section>
    </div>
</div>
{% endblock %}
