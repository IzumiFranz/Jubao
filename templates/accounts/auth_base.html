{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ page_title|default:"Account" }} | Budget Tracker{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'vendor/bootstrap/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/app.css' %}?v=v3">
</head>
<body class="app-body d-flex flex-column min-vh-100">
    <a class="visually-hidden-focusable skip-link" href="#auth-main-content">Skip to main content</a>

    <header class="bg-white border-bottom py-3">
        <div class="container">
            <span class="fw-semibold fs-5 text-dark">Budget Tracker</span>
        </div>
    </header>

    <main id="auth-main-content" class="flex-grow-1 d-flex align-items-center py-4 py-md-5" tabindex="-1">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-12 col-sm-10 col-md-7 col-lg-5 col-xl-4">
                    {% if messages %}
                    <div class="mb-3" aria-live="polite">
                        {% for message in messages %}
                        <div
                            class="alert {% if message.tags == 'error' %}alert-danger{% elif message.tags == 'success' %}alert-success{% else %}alert-info{% endif %} py-2 px-3 small mb-2"
                            role="status"
                        >
                            {{ message }}
                        </div>
                        {% endfor %}
                    </div>
                    {% endif %}

                    <div class="dashboard-panel p-4">
                        {% block auth_content %}{% endblock %}
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="{% static 'vendor/bootstrap/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
