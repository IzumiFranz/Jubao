{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ page_title|default:"Account" }} | Jubao{% endblock %}</title>
    <link rel="icon" href="{% static 'images/favicon.ico' %}" sizes="32x32">
    <link rel="icon" href="{% static 'images/favicon.svg' %}" type="image/svg+xml">
    <link rel="apple-touch-icon" href="{% static 'images/apple-touch-icon.png' %}" sizes="180x180">
    <link rel="stylesheet" href="{% static 'vendor/bootstrap/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/app.css' %}?v=v12">
</head>
<body class="app-body auth-page-body">
    <a class="visually-hidden-focusable skip-link" href="#auth-main-content">Skip to main content</a>

    <main id="auth-main-content" class="auth-page-container" tabindex="-1">
        <div class="auth-card-wrapper">
            <img src="{% static 'images/auth/jubao_auth_art.svg' %}" alt="" width="870" height="775" class="auth-card-art">

            <div class="auth-form-overlay">
                <div class="auth-form-column">
                    <a href="{% url 'budgets:dashboard' %}" class="auth-logo-link" title="Jubao">
                        <img src="{% static 'images/logo/jubao_text_light.png' %}" alt="Jubao" width="170" height="72" class="auth-logo-img">
                    </a>

                    {% if messages %}
                    <div class="mb-3" aria-live="polite">
                        {% for message in messages %}
                        <div
                            class="auth-alert {% if message.tags == 'error' %}auth-alert-danger alert-danger{% elif message.tags == 'success' %}alert-success{% else %}alert-info{% endif %}"
                            role="status"
                        >
                            {{ message }}
                        </div>
                        {% endfor %}
                    </div>
                    {% endif %}

                    {% block auth_content %}{% endblock %}
                </div>
            </div>
        </div>
    </main>

    <script src="{% static 'vendor/bootstrap/bootstrap.bundle.min.js' %}"></script>
    <script src="{% static 'js/app.js' %}?v=v12"></script>
</body>
</html>
